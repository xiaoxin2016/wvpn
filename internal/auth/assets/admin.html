<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>访问控制</title>
<style>
  :root{
    color-scheme: light dark;
    --bg:#f4f5f7; --card:#ffffff; --border:#e3e6ec; --line:#eef0f4;
    --fg:#151a23; --muted:#6b7280; --faint:#9aa1ad;
    --accent:#3b5bdb; --accent-fg:#fff; --accent-soft:#eef1fd;
    --danger:#c0392f; --danger-soft:#fdeeec; --ok:#1d7a4c;
    --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 28px -14px rgba(16,24,40,.16);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b0d12; --card:#141821; --border:#232a37; --line:#1c2230;
      --fg:#e8eaf0; --muted:#9aa3b2; --faint:#6b7484;
      --accent:#6b87f0; --accent-fg:#0b0d12; --accent-soft:#1a2133;
      --danger:#ef7a70; --danger-soft:#2a1b1a; --ok:#5ac08a;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 36px -20px rgba(0,0,0,.7);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
         "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:saturate(180%) blur(12px); border-bottom:1px solid var(--border);
  }
  .bar{max-width:960px; margin:0 auto; padding:13px 22px; display:flex; align-items:center; gap:14px}
  .bar h1{margin:0; font-size:15px; font-weight:620; letter-spacing:-.01em}
  .bar .spacer{flex:1}
  .who{color:var(--muted); font-size:13px}
  a.btn, button.btn{
    font:inherit; font-size:13px; padding:6px 12px; border-radius:9px; cursor:pointer;
    border:1px solid var(--border); background:var(--card); color:var(--fg); text-decoration:none;
  }
  a.btn:hover, button.btn:hover{border-color:var(--accent); color:var(--accent)}
  main{max-width:960px; margin:0 auto; padding:26px 22px 60px; display:grid; gap:20px}
  section{background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
          box-shadow:var(--shadow); padding:22px}
  h2{margin:0 0 4px; font-size:15px; font-weight:620}
  .hint{margin:0 0 18px; color:var(--muted); font-size:13px}
  label{display:block; font-size:12.5px; font-weight:560; color:var(--muted); margin:0 0 7px}
  .grid{display:grid; gap:16px}
  @media(min-width:760px){ .grid.two{grid-template-columns:1fr 1fr} }
  input[type=text], textarea{
    width:100%; border:1px solid var(--border); border-radius:10px; background:var(--bg);
    color:var(--fg); font:inherit; padding:10px 12px; outline:0; transition:border-color .15s, box-shadow .15s;
  }
  textarea{min-height:132px; resize:vertical; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:13px; line-height:1.7}
  input:focus, textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .sub{margin:6px 0 0; color:var(--faint); font-size:12px}
  .actions{display:flex; align-items:center; gap:12px; margin-top:18px}
  button.primary{
    padding:9px 18px; border:0; border-radius:10px; background:var(--accent);
    color:var(--accent-fg); font:inherit; font-weight:600; cursor:pointer;
  }
  button.primary:hover{opacity:.92}
  button.primary[disabled]{opacity:.55; cursor:not-allowed}
  .msg{font-size:13px; color:var(--muted)}
  .msg.err{color:var(--danger)} .msg.ok{color:var(--ok)}
  table{width:100%; border-collapse:collapse; font-size:13.5px}
  th{text-align:left; font-weight:560; color:var(--muted); font-size:12.5px;
     padding:0 10px 9px; border-bottom:1px solid var(--line)}
  td{padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:top}
  tr:last-child td{border-bottom:0}
  td.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12.5px; color:var(--muted)}
  .tag{display:inline-block; font-size:11px; padding:2px 7px; border-radius:999px;
       background:var(--accent-soft); color:var(--accent); margin-left:6px}
  button.revoke{font:inherit; font-size:12.5px; padding:5px 10px; border-radius:8px;
                border:1px solid var(--border); background:transparent; color:var(--danger); cursor:pointer}
  button.revoke:hover{background:var(--danger-soft)}
  .empty{color:var(--faint); font-size:13px; padding:14px 2px}
  .wrap{overflow-x:auto}
</style>
</head>
<body data-me="{{.Email}}">
<header>
  <div class="bar">
    <h1>访问控制</h1>
    <span class="spacer"></span>
    <span class="who">{{.Email}}</span>
    <a class="btn" href="/">返回门户</a>
    <a class="btn" href="/logout">退出</a>
  </div>
</header>

<main>
  <section>
    <h2>登录策略</h2>
    <p class="hint">默认域用于补全只填写前缀的邮箱；账号列表支持通配符 <code>*</code> 与 <code>?</code>，每行一条。</p>
    <div class="grid">
      <div>
        <label for="domain">默认邮箱域</label>
        <input id="domain" type="text" placeholder="test.com" autocapitalize="off" spellcheck="false">
        <p class="sub">留空则要求用户输入完整邮箱地址。</p>
      </div>
      <div class="grid two">
        <div>
          <label for="allowed">允许登录的账号</label>
          <textarea id="allowed" spellcheck="false" placeholder="*@test.com&#10;contractor@partner.com"></textarea>
          <p class="sub">空列表表示禁止任何人登录。</p>
        </div>
        <div>
          <label for="admins">管理员</label>
          <textarea id="admins" spellcheck="false" placeholder="ops@test.com"></textarea>
          <p class="sub">管理员自动获得登录权限，且必须包含你自己。</p>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="primary" id="save">保存</button>
      <span class="msg" id="cfg-msg" role="status" aria-live="polite"></span>
    </div>
  </section>

  <section>
    <h2>活动会话</h2>
    <p class="hint">会话保存在内存中，进程重启即全部失效。</p>
    <div class="wrap"><table>
      <thead><tr><th>账号</th><th>来源 IP</th><th>登录时间</th><th>过期时间</th><th></th></tr></thead>
      <tbody id="sessions"></tbody>
    </table></div>
    <p class="empty" id="no-sessions" hidden>暂无活动会话。</p>
  </section>
</main>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const me = document.body.dataset.me || "";

  const lines = (v) => v.split("\n").map(s => s.trim()).filter(Boolean);
  const fmt = (iso) => { const d = new Date(iso);
    return isNaN(d) ? "-" : d.toLocaleString(undefined, {hour12:false}); };

  function say(el, text, kind){ el.textContent = text || ""; el.className = "msg" + (kind ? " " + kind : ""); }

  async function api(url, opts){
    const r = await fetch(url, Object.assign({credentials:"same-origin"}, opts||{}));
    let data = {}; try { data = await r.json(); } catch(e){}
    if (r.status === 401) { location.href = "/login?next=" + encodeURIComponent("/admin"); }
    return {status:r.status, data};
  }

  async function loadConfig(){
    const {data} = await api("/admin/api/config");
    if (!data.ok) return;
    $("domain").value  = data.config.default_domain || "";
    $("allowed").value = (data.config.allowed_users || []).join("\n");
    $("admins").value  = (data.config.admins || []).join("\n");
  }

  async function saveConfig(){
    $("save").disabled = true; say($("cfg-msg"), "保存中…");
    const {data} = await api("/admin/api/config", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        default_domain: $("domain").value.trim(),
        allowed_users: lines($("allowed").value),
        admins: lines($("admins").value)
      })
    });
    $("save").disabled = false;
    if (!data.ok){ say($("cfg-msg"), data.error || "保存失败", "err"); return; }
    say($("cfg-msg"), "已保存", "ok");
    setTimeout(() => say($("cfg-msg"), ""), 2500);
  }

  async function loadSessions(){
    const {data} = await api("/admin/api/sessions");
    if (!data.ok) return;
    const list = (data.sessions || []).sort((a,b) => new Date(b.created) - new Date(a.created));
    const tbody = $("sessions");
    tbody.innerHTML = "";
    $("no-sessions").hidden = list.length > 0;
    for (const s of list){
      const tr = document.createElement("tr");
      const who = document.createElement("td");
      who.textContent = s.email;
      if (s.admin){ const t = document.createElement("span"); t.className = "tag"; t.textContent = "管理员"; who.appendChild(t); }
      if (s.email === me){ const t = document.createElement("span"); t.className = "tag"; t.textContent = "本机"; who.appendChild(t); }
      const ip = document.createElement("td"); ip.className = "mono"; ip.textContent = s.ip || "-";
      const created = document.createElement("td"); created.textContent = fmt(s.created);
      const expires = document.createElement("td"); expires.textContent = fmt(s.expires);
      const act = document.createElement("td");
      const btn = document.createElement("button");
      btn.className = "revoke"; btn.textContent = "注销";
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        await api("/admin/api/sessions/revoke", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({id: s.id})
        });
        loadSessions();
      });
      act.appendChild(btn);
      tr.append(who, ip, created, expires, act);
      tbody.appendChild(tr);
    }
  }

  $("save").addEventListener("click", saveConfig);
  loadConfig(); loadSessions();
  setInterval(loadSessions, 30000);
})();
</script>
</body>
</html>
