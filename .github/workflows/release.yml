# Builds the gateway for every supported platform and publishes a GitHub
# Release. Triggered by pushing a version tag, or manually for a tag that
# already exists.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号 tag，例如 v0.1.0"
        required: true
        type: string
      ref:
        description: "tag 尚不存在时，从这个分支或 commit 创建它"
        required: false
        default: main
        type: string

# The job only needs to create a release; nothing else in the repository.
permissions:
  contents: write

env:
  GO_VERSION: "1.24"

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A tag push builds that tag; a manual run builds the branch or
          # commit it names, and tags it below.
          ref: ${{ inputs.ref || github.ref }}
          # Release notes and tag lookups need the history, not a shallow copy.
          fetch-depth: 0

      # A manual run may name a tag that does not exist yet, which is how a
      # release is cut from the Actions UI rather than from a workstation.
      - name: resolve tag
        id: tag
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "tag ${tag} already exists"
            git checkout --detach "refs/tags/${tag}"
          else
            echo "creating tag ${tag} at $(git rev-parse --short HEAD)"
            # An annotated tag needs a committer; the runner has none by default.
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" -m "${tag}"
            git push origin "refs/tags/${tag}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: vet and test
        run: |
          go vet ./...
          go test ./...

      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${{ steps.tag.outputs.tag }}"
          commit="$(git rev-parse --short HEAD)"
          date="$(git show -s --format=%cI HEAD)"
          mkdir -p dist

          # A static binary per platform. -trimpath keeps build paths out of
          # the artifact so the same source produces the same bytes.
          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="webvpn"
            [ "$os" = "windows" ] && name="webvpn.exe"

            echo "building $os/$arch"
            GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${version} -X main.commit=${commit} -X main.buildDate=${date}" \
              -o "dist/$name" ./cmd/webvpn

            base="webvpn_${version}_${os}_${arch}"
            if [ "$os" = "windows" ]; then
              (cd dist && zip -q "${base}.zip" "$name" && rm "$name")
            else
              (cd dist && tar -czf "${base}.tar.gz" "$name" && rm "$name")
            fi
          done

          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "$tag" \
              --generate-notes \
              --verify-tag
          fi
